<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Velocity GT — Concept Preview</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background:
      radial-gradient(1200px 600px at 50% 78%, rgba(64,120,255,.16), transparent 65%),
      radial-gradient(900px 500px at 50% 20%, rgba(120,160,255,.10), transparent 60%),
      linear-gradient(180deg, #0a0e1c 0%, #101830 55%, #0a0f20 100%);
    font-family: "SF Pro Display", "Inter", -apple-system, "Segoe UI", sans-serif;
    color: #dbe4f5; overflow-x: hidden;
  }
  .stage { text-align: center; padding: 48px 20px 40px; animation: rise .9s ease-out both; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .kicker { letter-spacing: .35em; text-transform: uppercase; font-size: 12px; color: #7f96c4; margin: 0 0 10px; }
  h1 { margin: 0 0 6px; font-size: clamp(28px, 5vw, 46px); font-weight: 700; letter-spacing: .02em;
       background: linear-gradient(180deg, #f4f8ff, #9db8e8); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { color: #8ea4cd; font-size: 14px; margin: 0 0 26px; }
  .car { width: min(92vw, 1040px); height: auto; filter: drop-shadow(0 30px 60px rgba(10,40,120,.45)); }
  .floor { width: min(80vw, 720px); height: 1px; margin: -12px auto 26px;
           background: linear-gradient(90deg, transparent, rgba(140,170,255,.35), transparent); }
  .chips { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .chip { font-size: 12px; color: #a8bbe0; border: 1px solid rgba(140,170,255,.22);
          background: rgba(60,90,160,.14); padding: 7px 14px; border-radius: 999px; letter-spacing: .08em; }
  @media (prefers-reduced-motion: reduce) { .stage { animation: none; } }
</style>
</head>
